name: Deploy

# Checks run on every pull request through the org-required "Org lint"
# workflow (vite-plus / check, test, build). This workflow only ships.
#
#   push to main     wrangler deploy           -> github.shamwari.ai
#   push to staging  wrangler versions upload  -> preview alias "staging"
#                    (https://staging-shamwari-github-mcp.nyuchi.workers.dev),
#                    never deployed, so production keeps serving main.
#
# Both are gated on the repository variable DEPLOY_ENABLED == 'true'. Until
# the cut-over from nyuchi/web-services (which deploys the same Worker today)
# it stays unset, so the two repos never race to deploy one Worker.
#
# CLOUDFLARE_API_TOKEN needs Workers Scripts: Edit on the Nyuchi Web Services
# account and nothing else. The GitHub App key is a Worker secret set with
# `wrangler secret put` from 1Password (scripts/github-app-convert.sh); it
# never passes through CI.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (main)
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Metadata names the served host
        run: |
          for host in github.shamwari.ai github.nyuchi.dev; do
            got=$(curl -fsS "https://$host/.well-known/oauth-protected-resource" | jq -r .resource)
            test "$got" = "https://$host/mcp" || { echo "::error::$host advertises $got"; exit 1; }
          done

  beta:
    name: Beta (preview version from staging)
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Upload a preview version aliased staging
        run: >-
          npx wrangler versions upload --preview-alias staging
          --message "staging ${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
