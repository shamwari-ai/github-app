name: Deploy

# Checks run on every pull request through the org-required "Org lint"
# workflow (vite-plus / check, test, build). This workflow only ships.
#
#   push to main     wrangler deploy           -> github.shamwari.ai
#   push to staging  wrangler versions upload  -> preview alias "staging"
#                    (https://staging-shamwari-github-mcp.nyuchi.workers.dev),
#                    never deployed, so production keeps serving main.
#
# No variable or secret decides whether this runs: a merge to main deploys,
# a merge to staging uploads a preview. The one Worker is deployed from this
# repo only; nyuchi/web-services must not deploy it too, or the two race.
#
# CLOUDFLARE_API_TOKEN needs Workers Scripts: Edit on the Nyuchi Web Services
# account and nothing else. The GitHub App key is a Worker secret set with
# `wrangler secret put` from 1Password (scripts/github-app-convert.sh); it
# never passes through CI.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Metadata names the served host
        run: |
          for host in github.shamwari.ai; do
            got=$(curl -fsS "https://$host/.well-known/oauth-protected-resource" | jq -r .resource)
            test "$got" = "https://$host/mcp" || { echo "::error::$host advertises $got"; exit 1; }
          done

  beta:
    name: Beta (preview version from staging)
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Upload a preview version aliased staging
        run: >-
          npx wrangler versions upload --preview-alias staging
          --message "staging ${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
