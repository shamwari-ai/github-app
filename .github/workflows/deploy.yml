name: Deploy

# Trunk-based: pull requests (and the merge queue) run the checks; every merge
# to main deploys the Worker. There is no staging branch and no preview
# upload. The org-required "Org lint" workflow (actionlint, markdownlint,
# yamllint, vite-plus) is separate and runs on every pull request regardless.
#
#   pull_request, merge_group   fmt, clippy, test, wasm build, wrangler dry run
#   push to main                the same, then `wrangler deploy` -> github.shamwari.ai
#
# `merge_group` is what makes the required checks run for a queued pull
# request: without it the queue waits forever for a check that never starts.
#
# CLOUDFLARE_API_TOKEN needs Workers Scripts: Edit on the Nyuchi Web Services
# account and nothing else; CLOUDFLARE_ACCOUNT_ID is that account's id. Both are
# repository secrets, used by the deploy step only. The GitHub App key is a
# Worker secret set with `wrangler secret put` from 1Password
# (scripts/github-app-convert.sh secrets); it never passes through CI.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a deploy half way through; superseded pull request runs may go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Newer than 4.87: workers-rs 0.9 needs the `tracing` export that older
  # local runtimes lack. Bump deliberately; this is the version CI deploys with.
  WRANGLER_VERSION: 4.166.0

jobs:
  check:
    name: Check (fmt, clippy, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the channel, components and the wasm target;
      # `rustup show` installs exactly that.
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (host)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: clippy (wasm32)
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build the Worker exactly as wrangler does, without uploading
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --outdir "${RUNNER_TEMP}/worker-dry-run"

  deploy:
    name: Deploy (main)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Deploy to Cloudflare
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Metadata names the served host
        run: |
          for host in github.shamwari.ai; do
            got=$(curl -fsS "https://$host/.well-known/oauth-protected-resource" | jq -r .resource)
            test "$got" = "https://$host/mcp" || { echo "::error::$host advertises $got"; exit 1; }
          done
