# Version updates open against main (trunk-based: there is no staging branch)
# and wait a few days after a release. Security updates are not held back by
# the cooldown. Ignore entries need an expiry and an issue number.
#
# When a `worker` crate bump lands, bump `worker-build` to the same version in
# wrangler.toml's [build] command in that pull request: dependabot cannot see
# it there, and the generated shim is only guaranteed against its own crate.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
