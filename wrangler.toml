name = "nyuchi-github-mcp"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Nyuchi's Cloudflare account (the same one hosting nyuchi-fly-mcp and the
# docs workers).
account_id = "125a2dfbc21f76a25c980609609e8218"

workers_dev = true

# Custom domain on the nyuchi.dev zone, matching fly.nyuchi.dev. Wrangler
# provisions the cert and DNS record for the hostname on deploy.
routes = [{ pattern = "github.nyuchi.dev", custom_domain = true }]

# Stable, non-secret defaults. The private key is a SECRET (see below); every
# value here is public policy, versioned so a change to what the agent may
# touch shows up in a diff.
[vars]
GITHUB_API = "https://api.github.com"

# The App ID. This is the SAME App that mints release tokens
# (RELEASE_APP_ID), reused by explicit decision. The App holds Contents,
# Pull requests and Workflows read/write; the two settings below are what
# stop the agent inheriting all of that.
#
# Committed rather than set in the dashboard for two reasons. An App ID is an
# identifier, not a credential — it grants nothing without the private key,
# which is a Worker secret. And `wrangler deploy` REPLACES the deployed [vars]
# block, so a value set only in the dashboard is silently overwritten by the
# next deploy; it has to live here to survive.
GITHUB_APP_ID = "4980118"

# OUTER BOUND — repositories this worker will touch at all. Checked before a
# token is minted, so a repo outside this list never reaches GitHub. An empty
# or missing value denies every repository: a misconfigured worker should be
# useless rather than open.
GITHUB_ALLOWED_REPOS = "nyuchi/web-services,nyuchi/api-gateway,nyuchi/mukoko-platform"

# INNER BOUND — the permission set each installation token asks for. A token
# may request a SUBSET of what the App holds, never a superset, so this is
# what narrows a release-capable App down to a review-capable agent.
#
# `workflows` is absent deliberately: the App can push workflow files, this
# worker cannot. `contents` is read, not write, which is also what makes a
# merge tool impossible here rather than merely absent.
#
# NOTE: the release App does NOT currently hold an Issues permission, so
# `issues:write` will fail with 422 until Issues: read/write is added to the
# App and the installation re-authorised. `github_whoami` reports the gap.
GITHUB_TOKEN_PERMISSIONS = "pull_requests:write,issues:write,contents:read,metadata:read"

# The WorkOS AuthKit issuer — the OAuth 2.1 authorization server MCP clients
# discover from our resource metadata and run their PKCE flow against. Same
# host nyuchi-fly-mcp uses; see that file for why the three sibling hosts
# (auth.mukoko.com, api.nyuchi.com, api.mukoko.com) are NOT this.
WORKOS_AUTHORIZATION_SERVER = "https://accounts.mukoko.com"
MCP_RESOURCE_URL = "https://github.nyuchi.dev/mcp"

# Authorization policy (public, versioned for auditability).
# Org gate: Nyuchi Africa members only — blocks every other WorkOS org.
WORKOS_ORG_ID = "org_01KRDAB894DJF5V38PT5617TV1"
# Platform gate: the caller must hold the Platform Team role OR its
# mongodb:access permission (third-party app tokens surface permissions
# rather than the role).
WORKOS_REQUIRED_ROLES = "platform-team"
WORKOS_REQUIRED_PERMISSIONS = "mongodb:access"

# The reviewing model, as a Workers AI model id. A var, not a constant in
# code, so the model can be changed — and two models compared on the same
# pull request — without shipping new code.
#
#   @cf/zai-org/glm-5.3         1.31M ctx, $1.40/$4.40 per Mtok, reasoning
#   @cf/zai-org/glm-5.3-flash   1.31M ctx, $0.15/$0.50  — ~9x cheaper
#   @cf/moonshotai/kimi-k2.7-code  262K ctx, $0.95/$4.00, code-specialised
#
# Measured against this repository the median pull request diff is 4,757
# tokens and the largest 8,988, so a review costs roughly $0.027 on glm-5.3
# and $0.003 on the flash variant. At this repository's volume the difference
# is a few dollars a year: choose on whether the review is worth reading, not
# on price. GLM 5.3 requires a Workers Paid plan.
REVIEW_MODEL = "@cf/zai-org/glm-5.3"

# The handle that summons a review in a pull request comment. A var, not a
# constant, because this agent is heading for a brand of its own and the
# handle people type is the most visible thing about it.
REVIEW_MENTION = "@shamwari"

# Who may summon a review by mention. A SPENDING gate as much as an access
# one: on a public repository anyone can comment, and without this a stranger
# typing the handle bills model calls to the repository owner. GitHub states
# the association in the webhook payload, so it costs no extra call.
REVIEW_TRIGGER_ASSOCIATIONS = "OWNER,MEMBER,COLLABORATOR"

# AI Gateway to route inference through. UNSET = call Workers AI directly,
# which works and is what a first deploy does. Set it to the existing Shamwari
# gateway and every review is logged with the repository and its trigger
# attached, so "what did this repository cost this month" becomes a query
# rather than an estimate — and caching, retries and rate limits become
# gateway configuration instead of code in this worker.
# AI_GATEWAY_ID = "shamwari"

# KILL SWITCH. Set to exactly "false" to make every review call fail closed
# without a code deploy.
REVIEW_ENABLED = "true"

# Secrets — set with `wrangler secret put <NAME>` or in the Cloudflare
# dashboard (Workers -> nyuchi-github-mcp -> Settings -> Variables and Secrets):
#
#   GITHUB_APP_PRIVATE_KEY  The App's .pem, whole file including the BEGIN/END
#                           lines. PKCS#1 ("BEGIN RSA PRIVATE KEY", what
#                           GitHub hands you) or PKCS#8 both work — the worker
#                           wraps PKCS#1 itself, so this is byte-identical to
#                           RELEASE_APP_PRIVATE_KEY with no conversion.
#   WORKOS_JWKS_URL         https://accounts.mukoko.com/oauth2/jwks
#   WORKOS_ISSUER           https://accounts.mukoko.com
#   WORKOS_AUDIENCE         https://github.nyuchi.dev/mcp,client_01KVTX0V2K1VM3PSC0DJ9VZWTV
#
# WORKOS_AUDIENCE takes a comma-separated list because `aud` depends on how
# the token was obtained. A client that registers itself dynamically gets the
# RESOURCE URI; a client configured with the "Nyuchi Internal Tools" Connect
# app (client_01KVTX0V2K1VM3PSC0DJ9VZWTV) gets that CLIENT ID. Listing both
# accepts either and still rejects tokens minted for anything else.
#
# Those three are not guesses: they are the `jwks_uri` and `issuer` that
# https://accounts.mukoko.com/.well-known/oauth-authorization-server serves,
# and the resource URI below. Do NOT use the older SSO form
# https://api.workos.com/sso/jwks/<client_id> — AuthKit access tokens here are
# signed by the authorization server above, so that JWKS has no matching key
# and every call fails verification.
#
# `aud` only carries the resource URI once that URI is registered as an
# AuthKit OAuth resource in the WorkOS environment
# (environment_01KQBBSMDHMT9Y5GVD8S1A3C0W, the Production environment holding
# the Nyuchi Africa org). Until then WorkOS will not mint a token scoped to
# this resource. /mcp stays locked while WORKOS_ISSUER is unset.

# ---- Review agent -----------------------------------------------------------
# Workers AI. No API key: inference runs on the same platform as the worker
# and is billed to this Cloudflare account, so the review agent adds no
# third-party credential to hold and no egress to allow.
[ai]
binding = "AI"

# Worker observability. Mirrors what is configured on the deployed worker, so
# a `wrangler deploy` reproduces it rather than overwriting it — the same trap
# as [vars], which deploy replaces wholesale.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
